<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind Talks</title>
<meta name="theme-color" content="#2f6f73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind Talks">
<meta name="application-name" content="Mind Talks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column with a fixed "horizon" line as a visual anchor; three daily slots, log, report, episode card */
:root{
  --bg:#eef1f2; --surface:#ffffff; --ink:#1d2a2e; --muted:#5d6c70; --line:#d3dadc;
  --accent:#2f6f73; --accent-soft:#dbe9e9; --warm:#b5762f; --warm-soft:#f5e9d8; --done:#3d7a4f; --scrim:rgba(20,27,29,.45);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141b1d; --surface:#1c2528; --ink:#e3eaeb; --muted:#9aa9ac; --line:#2e3a3d;
  --accent:#7fbfc2; --accent-soft:#213335; --warm:#e0a660; --warm-soft:#33291c; --done:#7cc391; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.35}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted);font-size:.92rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.langpick select{font-family:var(--body);font-size:.9rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.horizon{height:2px;background:var(--accent);border-radius:2px;opacity:.7}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);min-width:0;text-align:center}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink);font-weight:600}
.dot.p1{background:var(--accent-soft)} .dot.p2{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.day.today .dot{outline:2px solid var(--warm);outline-offset:2px}
section.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.slot-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.when{font-size:.78rem;color:var(--accent);font-weight:600}
.mins{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
ol,ul{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--bg);cursor:pointer}
.task input{width:22px;height:22px;margin-top:3px;accent-color:var(--done);flex:none}
.task.is-done{opacity:.75}
.task .t{min-width:0;display:flex;flex-direction:column;gap:4px}
.script{background:var(--warm-soft);border-inline-start:3px solid var(--warm);padding:10px 12px;border-radius:6px;font-size:.95rem}
button{font-family:var(--display);font-size:.95rem;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--surface);font-weight:600}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible,.btnlike:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pacer{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.ball{width:150px;height:150px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);transform:scale(.45);transition:transform 4s ease-in-out}
.phase{position:absolute;font-family:var(--display);font-weight:600;font-size:1.05rem;text-align:center;line-height:1.3}
.phase small{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;color:var(--warm);font-variant-numeric:tabular-nums}
.seq{font-variant-numeric:tabular-nums;color:var(--muted);overflow-wrap:anywhere;direction:ltr;text-align:start}
.rate{display:flex;flex-direction:column;gap:6px}
.rate label{display:flex;justify-content:space-between;font-weight:500}
.rate output{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea{width:100%;min-height:72px;font-family:var(--body);font-size:.95rem;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);resize:vertical}
.log{display:flex;flex-direction:column;gap:8px}
.log-row{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--bg);font-size:.92rem}
.log-row .d{font-family:var(--display);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;font-size:.85rem}
.chip.ok{border-color:var(--done);color:var(--done)}
.log-row .th{color:var(--muted);font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:.92rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:.88rem}
.seg button.on{background:var(--accent);color:var(--surface)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--muted)}
.trend-down{color:var(--done)} .trend-up{color:var(--warm)} .flat{color:var(--muted);font-size:.8rem}
.tbl-wrap{overflow-x:auto}
table.wk{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums;min-width:420px}
table.wk th,table.wk td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.wk th{font-weight:600;color:var(--muted);font-size:.78rem}
.btnlike{display:inline-block;font-family:var(--display);font-size:.95rem;border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--accent);border:1.5px solid var(--accent);font-weight:600}
.sos{background:var(--accent);color:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.sos h2{color:var(--surface)}
.sos ol{gap:10px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
details[open] summary{margin-bottom:8px}
.note{font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--bg);cursor:pointer}
.opt input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
.opt > span{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (min-width:600px){.overlay{align-items:center}}
@media (prefers-reduced-motion: reduce){.ball{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
